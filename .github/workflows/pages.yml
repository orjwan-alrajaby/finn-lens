# Publishes Finn Lens's beta guide and product demo to GitHub Pages.
#
# Builds `browser-extension/site/` — the same Guide and ProductWalkthrough
# components the extension's Settings shows, and the branch's documentation
# from README.md, CHANGELOG.md and docs/ — and deploys it. Runs on every
# push to main that touches the extension, and by hand from the Actions tab.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

name: Publish guide and demo

on:
  push:
    branches: [main]
    paths:
      - "browser-extension/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - run: npm ci

      # Pages serves a project site under /<repository name>/.
      - run: npm run site:build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser-extension/.output/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
